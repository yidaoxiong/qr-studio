<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Logo Studio · 带 Logo 与文字说明的二维码生成器</title>
<link rel="icon" type="image/png" href="/*__FAVICON__*/">
<style>/*__CSS__*/</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img class="brand-icon" src="/*__BRAND_ICON__*/" alt="Slashbro" width="26" height="26">
    <h1>QR Logo Studio</h1>
    <span class="ver" id="appVersion" data-i18n-title="verTitle"></span>
    <span class="tag" data-i18n="tag"></span>
  </div>
  <div class="topbar-actions">
    <select id="langSel" class="lang-sel" data-i18n-title="lang.title"></select>
    <button id="btnReset" class="ghost" data-i18n="reset"></button>
    <button id="btnPresetLight" class="ghost" data-i18n="presetLight"></button>
    <button id="btnPresetDark" class="ghost" data-i18n="presetDark"></button>
  </div>
</header>

<main class="layout">
  <!-- ================= 左：控制面板 ================= -->
  <section class="panel">
    <div class="card">
      <h2 data-i18n="h.content"></h2>
      <label class="field">
        <span class="label" data-i18n="contentLabel"></span>
        <textarea id="content" rows="3" spellcheck="false" placeholder="https://example.com">https://slashbro.top/</textarea>
      </label>
      <div class="row">
        <label class="field grow">
          <span class="label"><span data-i18n="ecc"></span> <em id="eccHint"></em></span>
          <div class="segmented" id="eccSeg">
            <button data-v="L">L 7%</button>
            <button data-v="M">M 15%</button>
            <button data-v="Q">Q 25%</button>
            <button data-v="H" class="on">H 30%</button>
          </div>
        </label>
      </div>
      <div class="row">
        <label class="field grow">
          <span class="label" data-i18n="version"></span>
          <select id="version"></select>
        </label>
        <label class="field grow">
          <span class="label" data-i18n="quiet"></span>
          <input type="number" id="quiet" value="4" min="0" max="10" step="1">
        </label>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="h.logo"></h2>
      <div id="drop" class="drop">
        <input type="file" id="logoFile" accept="image/*" hidden>
        <div class="drop-inner">
          <span><b data-i18n="drop.drag"></b> / <span class="link" id="pickLogo" data-i18n="drop.pick"></span> / <span data-i18n="drop.paste"></span></span>
          <small data-i18n="drop.formats"></small>
        </div>
        <img id="logoThumb" alt="" hidden>
      </div>
      <div class="row">
        <label class="field grow">
          <span class="label" data-i18n="logoUrl"></span>
          <input type="url" id="logoUrl" placeholder="https://…/logo.png">
        </label>
        <button id="btnLoadUrl" class="ghost self-end" data-i18n="btnLoad"></button>
      </div>
      <div class="row">
        <label class="field grow">
          <span class="label"><span data-i18n="logoW"></span> <b id="lwVal">22%</b> <em data-i18n="logoWUnit"></em></span>
          <input type="range" id="logoW" min="0" max="60" step="1" value="22">
        </label>
        <label class="field grow">
          <span class="label"><span data-i18n="logoH"></span> <b id="lhVal">22%</b></span>
          <input type="range" id="logoH" min="0" max="60" step="1" value="22">
        </label>
      </div>
      <div class="row wrap">
        <button class="chip" data-ratio="square" data-i18n="chip.square"></button>
        <button class="chip" data-ratio="wide" data-i18n="chip.wide"></button>
        <button class="chip" data-ratio="wide3" data-i18n="chip.wide3"></button>
        <button class="chip" data-ratio="tall" data-i18n="chip.tall"></button>
        <button class="chip" data-ratio="fit" data-i18n="chip.fit"></button>
        <button class="chip" data-ratio="clear" data-i18n="chip.clear"></button>
      </div>
      <div class="row">
        <label class="field grow">
          <span class="label"><span data-i18n="logoShape"></span> <em id="shapeHint"></em></span>
          <select id="logoShape">
            <option value="none" data-i18n="shape.none"></option>
            <option value="round" selected data-i18n="shape.round"></option>
            <option value="square" data-i18n="shape.square"></option>
            <option value="circle" data-i18n="shape.circle"></option>
          </select>
        </label>
        <label class="field grow">
          <span class="label"><span data-i18n="platePad"></span> <b id="lpadVal">10%</b></span>
          <input type="range" id="logoPad" min="0" max="40" step="1" value="10">
        </label>
      </div>
      <label class="check"><input type="checkbox" id="logoPlate" checked> <span data-i18n="plate"></span></label>
    </div>

    <div class="card">
      <h2 data-i18n="h.text"></h2>
      <label class="field">
        <span class="label" data-i18n="titleField"></span>
        <input type="text" id="title" value="" data-i18n-ph="titlePh">
      </label>
      <label class="field">
        <span class="label" data-i18n="subField"></span>
        <input type="text" id="subtitle" value="" data-i18n-ph="subPh">
      </label>
      <label class="field">
        <span class="label" data-i18n="font"></span>
        <select id="fontFamily"></select>
      </label>
      <div class="fontsample" id="fontSample">Grüße · ¡Hola! Año ¿qué? · Voilà être · 中文示例</div>
      <div class="row">
        <label class="field grow">
          <span class="label"><span data-i18n="titleSize"></span> <b id="tsVal">22</b></span>
          <input type="range" id="titleSize" min="8" max="72" step="1" value="22">
        </label>
        <label class="field grow">
          <span class="label"><span data-i18n="subSize"></span> <b id="ssVal">14</b></span>
          <input type="range" id="subSize" min="6" max="48" step="1" value="14">
        </label>
      </div>
      <div class="row">
        <label class="field grow">
          <span class="label" data-i18n="weight"></span>
          <select id="weight">
            <option value="300" data-i18n="w.300"></option>
            <option value="400" data-i18n="w.400"></option>
            <option value="500" data-i18n="w.500"></option>
            <option value="600" selected data-i18n="w.600"></option>
            <option value="700" data-i18n="w.700"></option>
            <option value="900" data-i18n="w.900"></option>
          </select>
        </label>
        <label class="field grow">
          <span class="label" data-i18n="align"></span>
          <select id="align">
            <option value="center" selected data-i18n="align.center"></option>
            <option value="left" data-i18n="align.left"></option>
            <option value="right" data-i18n="align.right"></option>
          </select>
        </label>
      </div>
      <div class="row">
        <label class="field grow">
          <span class="label"><span data-i18n="letterSpacing"></span> <b id="lsVal">0</b>px</span>
          <input type="range" id="letterSpacing" min="-2" max="10" step="0.5" value="0">
        </label>
        <label class="field grow">
          <span class="label"><span data-i18n="lineHeight"></span> <b id="lhXVal">1.35</b></span>
          <input type="range" id="lineHeight" min="1" max="2.2" step="0.05" value="1.35">
        </label>
      </div>
      <label class="field">
        <span class="label" data-i18n="textColor"></span>
        <input type="color" id="textColor" value="#0f172a">
      </label>
    </div>

    <div class="card">
      <h2 data-i18n="h.appearance"></h2>
      <div class="row">
        <label class="field grow">
          <span class="label" data-i18n="fgColor"></span>
          <input type="color" id="fgColor" value="#000000">
        </label>
        <label class="field grow">
          <span class="label" data-i18n="bgColor"></span>
          <input type="color" id="bgColor" value="#ffffff">
        </label>
        <label class="field grow">
          <span class="label" data-i18n="cardColor"></span>
          <input type="color" id="cardColor" value="#ffffff">
        </label>
      </div>
      <label class="field">
        <span class="label" data-i18n="moduleShape"></span>
        <div class="segmented" id="dotSeg">
          <button data-v="square" class="on" data-i18n="dot.square"></button>
          <button data-v="round" data-i18n="dot.round"></button>
          <button data-v="dots" data-i18n="dot.dots"></button>
        </div>
      </label>
      <div class="row">
        <label class="field grow">
          <span class="label"><span data-i18n="cardRadius"></span> <b id="crVal">24</b>px</span>
          <input type="range" id="cardRadius" min="0" max="80" step="1" value="24">
        </label>
        <label class="field grow">
          <span class="label"><span data-i18n="cardPad"></span> <b id="cpVal">28</b>px</span>
          <input type="range" id="cardPad" min="0" max="80" step="1" value="28">
        </label>
      </div>
      <div class="row">
        <label class="field grow">
          <span class="label"><span data-i18n="imagePad"></span> <b id="ipVal">0</b>px</span>
          <input type="range" id="imagePad" min="0" max="80" step="1" value="0">
        </label>
        <label class="field grow">
          <span class="label"><span data-i18n="textGap"></span> <b id="tgVal">21</b>px</span>
          <input type="range" id="textGap" min="0" max="120" step="1" value="21">
        </label>
      </div>
      <p class="note spacing-note" data-i18n-html="spacingNote"></p>
      <div class="row">
        <label class="field grow">
          <span class="label"><span data-i18n="qrSize"></span> <b id="qsVal">320</b>px</span>
          <input type="range" id="qrSize" min="160" max="640" step="8" value="320">
        </label>
        <label class="field grow">
          <span class="label" data-i18n="exportScale"></span>
          <select id="exportScale">
            <option value="1" data-i18n="scale.1"></option>
            <option value="2" selected data-i18n="scale.2"></option>
            <option value="3" data-i18n="scale.3"></option>
            <option value="4" data-i18n="scale.4"></option>
          </select>
        </label>
      </div>
      <label class="check"><input type="checkbox" id="transparentBg"> <span data-i18n="transparentBg"></span></label>
    </div>
  </section>

  <!-- ================= 右：预览与体检 ================= -->
  <section class="stage">
    <div class="card preview-card">
      <div class="preview-head">
        <h2 data-i18n="h.preview"></h2>
        <div class="preview-meta" id="previewMeta"></div>
      </div>
      <div class="canvas-wrap"><canvas id="preview"></canvas></div>
    </div>

    <div class="card">
      <div class="preview-head">
        <h2><span data-i18n="h.check"></span> <em data-i18n="checkNote"></em></h2>
        <button id="btnAutoFix" class="primary sm" data-i18n="autoFix"></button>
      </div>
      <ul class="checks" id="checks"></ul>
      <p class="note" id="pdfNote" hidden></p>
    </div>

    <div class="card">
      <h2 data-i18n="h.export"></h2>
      <div class="row wrap">
        <button id="btnPng" class="primary" data-i18n="btnPng"></button>
        <button id="btnSvg" class="primary" data-i18n="btnSvg"></button>
        <button id="btnPdf" class="primary" data-i18n="btnPdf"></button>
        <button id="btnCopy" class="ghost" data-i18n="btnCopy"></button>
      </div>
      <p class="note"><span data-i18n="exportNote"></span><span id="vectorNote"></span></p>
    </div>
  </section>
</main>

<section class="cloud-wrap">
  <div class="card cloud-card">
    <div class="preview-head">
      <h2><span data-i18n="h.cloud"></span> <em id="cloudCount"></em></h2>
      <div class="cloud-head-actions">
        <button id="btnRefreshCloud" class="ghost sm" data-i18n="refresh"></button>
        <button id="btnSaveCloud" class="primary sm" data-i18n="saveCloud"></button>
      </div>
    </div>
    <p class="note" id="cloudNote"></p>
    <p class="note cloud-status" id="cloudStatus" hidden></p>
    <div id="cloudList" class="cloud-list"></div>
  </div>
</section>

<div id="toast" class="toast" hidden></div>

<script>/*__LIB_QRCODE__*/</script>
<script>/*__LIB_JSQR__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
